services:
  postgres:
    image: postgres:16
    container_name: oil_report_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oil_reports}
      POSTGRES_USER: ${POSTGRES_USER:-oil_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oil_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oil_user} -d ${POSTGRES_DB:-oil_reports}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oil_report_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-oil_user}:${POSTGRES_PASSWORD:-oil_password}@postgres:5432/${POSTGRES_DB:-oil_reports}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      UPLOAD_DIR: /app/tmp_uploads
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
    volumes:
      - ./backend:/app
      - backend_tmp_uploads:/app/tmp_uploads
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oil_report_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_tmp_uploads:
